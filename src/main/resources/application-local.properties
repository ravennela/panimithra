spring.application.name=fixmate
 
# ===============================
#   DATABASE CONFIGURATION (Aiven MySQL)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# Razor pay keys
razorpay.api.key=${RAZORPAY_API_KEY}
razorpay.api.secret=${RAZORPAY_API_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}
server.port=${PORT:8080}
server.address=0.0.0.0
# ===============================
#   JPA / HIBERNATE CONFIGURATION
# ===============================

# ===============================
# SPRING STARTUP (CRITICAL)
# ===============================
spring.main.lazy-initialization=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
 
# ===============================
#   CONNECTION POOL (HikariCP)
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
gcp.bucket.name=panimithra
#spring.cloud.gcp.credentials.location=file:/app/panimithra-service-account.json
spring.cloud.gcp.credentials.enabled=true
spring.cloud.gcp.credentials.location=


#gamil related
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=50000
spring.mail.properties.mail.smtp.writetimeout=50000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
